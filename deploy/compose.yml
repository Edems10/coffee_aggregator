# The whole deployment for one server: the database and the crawler that fills
# it, on one private network. Run it from this directory, or point -f at it.
#
# The database publishes no port. Both containers are on the same compose
# network, so the crawler reaches it as `db:5432` and nothing outside the host
# can reach it at all — which is the reason to keep the database local rather
# than expose 5432 to the internet.

name: coffee-aggregator

services:
  db:
    image: postgres:18-alpine
    container_name: coffee-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      POSTGRES_DB: coffee
      TZ: ${TZ:-Europe/Prague}
    volumes:
      # Postgres 18 keeps its data in /var/lib/postgresql/18/docker and refuses
      # to start when the volume is mounted at the older .../data path.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee -d coffee"]
      interval: 5s
      timeout: 5s
      retries: 10
    # This host runs other things. Postgres with the image's defaults wants
    # ~128 MB of shared buffers and grows with connections, so it gets a
    # ceiling rather than a share of whatever is free. A positive oom_score_adj
    # puts it ahead of Plex and the *arr services in the queue when memory runs
    # out: losing a crawl mid-write costs one night, and Postgres recovers from
    # being killed — losing a media server costs the evening.
    mem_limit: 512m
    mem_reservation: 192m
    oom_score_adj: 200

  crawler:
    build:
      context: ..
    image: coffee-aggregator:local
    # Behind a profile: `docker compose up -d` brings up only the database, and
    # the crawl is a `run --rm` that starts, works and exits.
    profiles: ["crawler"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://coffee:${POSTGRES_PASSWORD:?}@db:5432/coffee
      COFFEE_AGG_CONTACT: ${COFFEE_AGG_CONTACT:-}
      COFFEE_AGG_FX_CACHE: /tmp/fx_rates.json
      TZ: ${TZ:-Europe/Prague}
    # The crawl writes to Postgres and to stdout, nothing else.
    read_only: true
    tmpfs:
      - /tmp
    # Batches of 50 products and the parse tree of one page at a time; the
    # ceiling is generous. Most expendable thing on the box: a killed crawl is
    # re-run tomorrow morning.
    mem_limit: 512m
    mem_reservation: 128m
    oom_score_adj: 600

  # The table browser, in place of the one a hosted provider would have given
  # you. It joins two networks: `default` to reach the database by name, and the
  # external `proxy` network so nginx-proxy-manager — which lives in another
  # compose stack — can reach *it* by name. No port is published on the host,
  # so the only way in is through the proxy.
  pgweb:
    image: sosedoff/pgweb:latest
    container_name: coffee-pgweb
    restart: unless-stopped
    environment:
      PGWEB_DATABASE_URL: postgresql://coffee:${POSTGRES_PASSWORD:?}@db:5432/coffee?sslmode=disable
      TZ: ${TZ:-Europe/Prague}
    command:
      - --bind=0.0.0.0
      - --listen=8081
      # One fixed database: the connection cannot be pointed elsewhere from the
      # browser, and the URL above is the only one it will ever use.
      - --lock-session
      - --no-idle-timeout
      # Basic auth as well as the proxy's own. The proxy is the front door, but
      # a misconfigured proxy should not be the only lock on the data.
      - --auth-user=${PGWEB_USER:-coffee}
      - --auth-pass=${PGWEB_PASSWORD:?set PGWEB_PASSWORD in the env file}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - proxy
    mem_limit: 128m
    mem_reservation: 32m
    oom_score_adj: 400

  # The morning report as a page. nginx-proxy-manager forwards to a host and a
  # port, it does not serve a directory, so serving the file the nightly run
  # writes takes a web server of its own — the same shape as pgweb.
  #
  # The published port binds to 127.0.0.1 by default, which means the host and
  # nothing else. Set REPORT_BIND to a Tailscale address to read it from another
  # machine on the tailnet without putting it on the LAN, or leave it alone and
  # point an nginx-proxy-manager host at `coffee-report:80` over the shared
  # proxy network for a real hostname and a certificate.
  report:
    image: nginx:alpine
    container_name: coffee-report
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Prague}
    volumes:
      # Read-only: the page is written by the nightly run, never by this server.
      - ${REPORT_DIR:-/var/www/coffee}:/usr/share/nginx/html:ro
    ports:
      - "${REPORT_BIND:-127.0.0.1}:${REPORT_PORT:-8088}:80"
    networks:
      - default
      - proxy
    mem_limit: 32m
    mem_reservation: 8m
    oom_score_adj: 500

volumes:
  pgdata:

networks:
  # Created once, by hand, and shared with the stack that runs the proxy:
  #   docker network create proxy
  proxy:
    external: true
