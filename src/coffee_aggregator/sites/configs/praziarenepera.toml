# Epera Coffee — 12 attributes plus a "Label: value" block; the shop also
# sells cold brew and house blends that carry no origin.
platform = "woocommerce"
site_id = "praziarenepera"
name = "Epera Coffee"
country = "SK"
base_url = "https://www.praziarenepera.sk/"
currency = "EUR"
mode = "api"
max_pages = 10

# Pinned ids, not slugs: ids survive a re-theme, slugs do not.
# 20 cerstva-kava (25).
api_category_ids = [20]

# The HTML fallback, used only if /wp-json/ ever stops answering.
category_urls = [
  "https://www.praziarenepera.sk/kategoria-produktu/cerstva-kava/",
]

# The catalogue also sells things that are not coffee beans.
ignore = [
  "nitro",
  "cold brew",
  "vzork",
]
