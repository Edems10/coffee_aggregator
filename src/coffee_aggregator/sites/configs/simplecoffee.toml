# /kategoria-produktu/zrnkova-kava/ bounces to a single product, so the
# listing fallback stays on the shop's own /kategorie/ base. 244
# zrnkova-kava is the bean root and also parents the tasting boxes.
platform = "woocommerce"
site_id = "simplecoffee"
name = "Simple Coffee"
country = "SK"
base_url = "https://simplecoffee.sk/"
currency = "EUR"
mode = "api"
max_pages = 10

# Pinned ids, not slugs: ids survive a re-theme, slugs do not.
api_category_ids = [244]

# The HTML fallback, used only if /wp-json/ ever stops answering.
category_urls = [
  "https://simplecoffee.sk/kategorie/zrnkova-kava/",
]

# The catalogue also sells things that are not coffee beans.
ignore = [
  "degustacn",
  "predplatne",
  "v cokolade",
]
