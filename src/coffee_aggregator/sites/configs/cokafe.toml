# COKAFE — a Czech roastery whose catalogue mixes a bakery with the coffee;
# category 56 kava is the bean-only tree. Seven origin attributes per product.
platform = "woocommerce"
site_id = "cokafe"
name = "COKAFE"
country = "CZ"
base_url = "https://cokafe.com/"
currency = "CZK"
mode = "api"
max_pages = 10

# Pinned ids, not slugs: ids survive a re-theme, slugs do not.
# 56 kava (11).
api_category_ids = [56]

# The HTML fallback, used only if /wp-json/ ever stops answering.
category_urls = [
  "https://cokafe.com/produkty/kava/",
]

# The catalogue also sells things that are not coffee beans.
ignore = [
  "pecivo",
  "zakusek",
  "dort",
]
