# Triple Five Coffee — simple products with a bilingual (SK + EN)
# "Label: value" block in the description; no origin attributes at all.
platform = "woocommerce"
site_id = "triplefivecoffee"
name = "Triple Five Coffee"
country = "SK"
base_url = "https://triplefivecoffee.com/"
currency = "EUR"
mode = "api"
max_pages = 10

# Pinned ids, not slugs: ids survive a re-theme, slugs do not.
# 27 kava (21).
api_category_ids = [27]

# The HTML fallback, used only if /wp-json/ ever stops answering.
category_urls = [
  "https://triplefivecoffee.com/product-category/kava/",
]

# The catalogue also sells things that are not coffee beans.
ignore = [
  "merch",
  "darcek",
]

[label_map]
"Profil praženia" = "roast"
"Výber hmotnosti" = "weight"
