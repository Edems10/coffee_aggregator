# grinders.sk serves its shop from australiancoffeecompany.sk, so the base
# URL is the serving host. 34 kava plus the separate 36 blendy root; the
# 46 caj tree is left out.
platform = "woocommerce"
site_id = "grinders"
name = "Grinders Coffee"
country = "SK"
base_url = "https://australiancoffeecompany.sk/"
currency = "EUR"
mode = "api"
max_pages = 10

# Pinned ids, not slugs: ids survive a re-theme, slugs do not.
api_category_ids = [34, 36]

# The HTML fallback, used only if /wp-json/ ever stops answering.
category_urls = [
  "https://australiancoffeecompany.sk/obchod/kava/",
]

# The catalogue also sells things that are not coffee beans.
ignore = [
  "caj",
]
