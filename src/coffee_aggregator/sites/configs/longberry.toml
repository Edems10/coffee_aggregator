# LONGBERRY — a Czech shop with duplicated category trees (kava 156 and
# kava-2 581 hold the same products); one tree is pinned so nothing is
# counted twice. Origin data is a "Label: value" block.
platform = "woocommerce"
site_id = "longberry"
name = "LONGBERRY"
country = "CZ"
base_url = "https://www.longberry.cz/"
currency = "CZK"
mode = "api"
max_pages = 10

# Pinned ids, not slugs: ids survive a re-theme, slugs do not.
# 156 kava (31).
api_category_ids = [156]

# The HTML fallback, used only if /wp-json/ ever stops answering.
category_urls = [
  "https://www.longberry.cz/kategorie-produktu/kava/",
]

# The catalogue also sells things that are not coffee beans.
ignore = [
  "zelena kava",
  "degustacni",
  "liskovy",
  "irsky krem",
]

[label_map]
"Region/oblast" = "region"
"Farma/mycí stanice" = "farm"
