# Serious Coffee — two attributes plus a full "Label: value" description
# block; the category tree is vyberova / espresso-blend / decaf.
platform = "woocommerce"
site_id = "seriouscoffee"
name = "Serious Coffee"
country = "SK"
base_url = "https://www.seriouscoffee.sk/"
currency = "EUR"
mode = "api"
max_pages = 10

# Pinned ids, not slugs: ids survive a re-theme, slugs do not.
# 191 vyberova (4), 222 decaf (1), 196 espresso-blend (1).
api_category_ids = [191, 222, 196]

# The HTML fallback, used only if /wp-json/ ever stops answering.
category_urls = [
  "https://www.seriouscoffee.sk/kategoria-produktu/vyberova/",
  "https://www.seriouscoffee.sk/kategoria-produktu/decaf/",
  "https://www.seriouscoffee.sk/kategoria-produktu/espresso-blend/",
]
