# Trip Coffee Roasters — full attribute set; an older Store API build that
# omits prices.price_range on variable products.
platform = "woocommerce"
site_id = "triproasters"
name = "Trip Coffee Roasters"
country = "SK"
base_url = "https://triproasters.sk/"
currency = "EUR"
mode = "api"
max_pages = 10

# Pinned ids, not slugs: ids survive a re-theme, slugs do not.
# 22 vyberova-kava (14).
api_category_ids = [22]

# The HTML fallback, used only if /wp-json/ ever stops answering.
category_urls = [
  "https://triproasters.sk/vyberova-kava/",
]

# The catalogue also sells things that are not coffee beans.
ignore = [
  "merch",
  "tricko",
  "rozmer",
]

[label_map]
"Cup score" = "sca_score"
"Minimálny odber" = ""
