# ViEM Coffee — one category, a long description carrying a full
# "Label: value" block (Farma, Majiteľ, Nadmorská výška, Cuppingové skóre).
platform = "woocommerce"
site_id = "viemcoffee"
name = "ViEM Coffee"
country = "SK"
base_url = "https://www.viemcoffee.sk/"
currency = "EUR"
mode = "api"
max_pages = 10

# Pinned ids, not slugs: ids survive a re-theme, slugs do not.
# 19 kava-na-espresso (6).
api_category_ids = [19]

# The HTML fallback, used only if /wp-json/ ever stops answering.
category_urls = [
  "https://www.viemcoffee.sk/kategoria-produktu/kava-na-espresso/",
]

[label_map]
"Nad. výška" = "altitude"
