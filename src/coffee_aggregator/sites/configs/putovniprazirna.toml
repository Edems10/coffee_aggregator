# Putovní Pražírna — the shop lives on the shop. subdomain. It writes the
# variety row in the plural ("Odrůdy") and names the washing station
# "Stanice".
platform = "shoptet"
site_id = "putovniprazirna"
name = "Putovní Pražírna"
country = "CZ"
base_url = "https://shop.putovniprazirna.cz/"
category_urls = ["https://shop.putovniprazirna.cz/kava-2/"]
currency = "CZK"
max_pages = 20
pagination = "path"

# Parameter names this shop invents that the built-in CZ/SK/EN map
# does not already cover.
[label_map]
"Odrůdy" = "variety"
"Stanice" = "washing_station"
"Země" = "country"
"Varianta" = "weight"
