# Prices come back with currency_minor_unit = 0, so "330" is 330 Kc, not 3.30.
# Every origin fact is a "Label: value" line in the description; the only two
# attributes are the bag size and a grind question.
platform = "woocommerce"
site_id = "brdskakava"
name = "Brdská káva"
country = "CZ"
base_url = "https://www.brdskakava.cz/"
currency = "CZK"
mode = "api"
max_pages = 10

# Pinned ids, not slugs: ids survive a re-theme, slugs do not.
api_category_ids = [21]

# The HTML fallback, used only if /wp-json/ ever stops answering.
category_urls = [
  "https://www.brdskakava.cz/kategorie-produktu/prazena-kava/",
]

# The catalogue also sells things that are not coffee beans.
ignore = [
  "doza",
  "lzicka",
  "hrnek",
  "mlynek",
]
