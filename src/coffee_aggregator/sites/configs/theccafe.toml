# The one shop of this batch with currency_minor_unit = 1: "129" means
# 12.90 EUR, so a hard-coded /100 would be wrong by a factor of ten. Two
# flat bean categories, 37 blends and 38 single origin.
platform = "woocommerce"
site_id = "theccafe"
name = "The C Cafe"
country = "SK"
base_url = "https://theccafe.sk/"
currency = "EUR"
mode = "api"
max_pages = 10

# Pinned ids, not slugs: ids survive a re-theme, slugs do not.
api_category_ids = [37, 38]

# The HTML fallback, used only if /wp-json/ ever stops answering.
category_urls = [
  "https://theccafe.sk/kategoria-produktu/kavy-jednodruhove-single-origin/",
]
