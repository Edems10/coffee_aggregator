# 18 prazena-kava is the bean root; 15 vsetky-produkty is a catch-all that
# would drag in courses and cocoa. Origin facts are "Label: value" lines,
# including a cupping score.
platform = "woocommerce"
site_id = "frisnakava"
name = "Frišná káva"
country = "SK"
base_url = "https://frisnakava.sk/"
currency = "EUR"
mode = "api"
max_pages = 10

# Pinned ids, not slugs: ids survive a re-theme, slugs do not.
api_category_ids = [18]

# The HTML fallback, used only if /wp-json/ ever stops answering.
category_urls = [
  "https://frisnakava.sk/kategoria-produktu/prazena-kava/vyberova-kava/",
]

# The catalogue also sells things that are not coffee beans.
ignore = [
  "kurz",
  "kakao",
  "darcek",
  "set vyberoviek",
  # Both boxed sets hold four different coffees in one listing.
  "set v krabicke",
]
