 <script id="props" type="application/json">
 {"selectedCategory":"Coffee","products":[{"active":true,"attributeGroups":[],"common":true,"createdAt":"2026-09-10T14:26:51.832Z","createdBy":"a3347812-00d1-7026-049a-9aa4b9c1e712","description":{"en":"<p><i><strong>Chapata</strong> quickly found its place in our roastery and in your homes. It's the kind of coffee you want to drink every day. We return to it again and again. We roast this specialty whole bean coffee of the <strong>Castillo</strong> variety, <strong>naturally processed with extended fermentation</strong>, <strong>both for filter and in an espresso version</strong>, and its profile is dominated by <strong>candied orange, star anise and cocoa</strong> notes.</i></p><p><strong>Coffee details</strong></p><p><strong>Country:</strong> Colombia<br><strong>Region:</strong> Anserma, Caldas<br><strong>Farm / station:</strong> Anserma Cooperative (Attia – Chapata project)<br><strong>Producer:</strong> Luis Miguel (General Manager)<br><strong>Altitude:</strong> 1,800 m a.s.l.<br><strong>Variety:</strong> Castillo<br><strong>Processing:</strong> natural, with extended fermentation<br><strong>Taste notes:</strong> candied orange, star anise, cocoa<br><strong>Coffee type:</strong> roasted whole bean coffee, Arabica</p>","cs":"<p><i>Káva <strong>Chapata</strong> si u nás v pražírně i u vás doma našla své místo velmi rychle. Je to ten typ kávy, kterou chcete pít každý den. Vracíme se k ní opakovaně. Výběrovou zrnkovou kávu z odrůdy <strong>Castillo</strong>, zpracovanou metodou <strong>natural s prodlouženou fermentací</strong>, pražíme <strong>jak na filtr, tak i ve verzi na espresso</strong> a v jejím profilu dominují tóny <strong>kandovaného pomeranče, badyánu a kakaa</strong>.</i></p><p><strong>Detaily o kávě</strong></p><p><strong>Země:</strong> Kolumbie<br><strong>Oblast:</strong> Anserma, Caldas<br><strong>Farma / stanice:</strong> družstvo Anserma (projekt Attia - Chapata)<br><strong>Producent:</strong> Luis Miguel (generální manažer družstva)<br><strong>Nadmořská výška:</strong> 1 800 m n. m.<br><strong>Odrůda:</strong> Castillo<br><strong>Zpracování:</strong> suché (natural) s prodlouženou fermentací<br><strong>Chuťový profil:</strong> kandovaný pomeranč, badyán, kakao<br><strong>Typ kávy:</strong> pražená zrnková káva, arabika</p>"},"disclosures":{"en":[{"content":"<p>We roast this coffee for espresso. It suits both lever and automatic machines, as well as home brewing.</p><p>Want it for filter? We also roast a filter version - you'll find it here: <a href=\"https://fathers.cz/kava/filtr/kolumbie-chapata\">Colombia - Chapata</a></p>","title":"Preparation"},{"title":"Farm story","content":"<p>You can taste the care with which <strong>Luis Miguel and the people in Anserma</strong> prepared it, as well as the courage they showed in embracing <strong>new processing methods</strong>. It's a coffee you'll love returning to for its <strong>approachability and warm character</strong>.</p><p>The Anserma cooperative brings together <strong>over two thousand small-scale farmers</strong> for whom coffee is a way of life. To protect the quality of their finest microlots, they built <strong>temperature-controlled warehouses</strong> in Anserma to shield the coffee from fluctuations in heat and humidity.</p><p>Luis Miguel embraced innovation by investing in a <strong>specialized Nuna Coffee drying box</strong>. This technology allows for <strong>precise regulation of temperature and humidity</strong>, which is crucial in the unpredictable climate of the Colombian Andes. As a result, Anserma can produce <strong>high-clarity natural coffees</strong> - a feat that was previously very risky in this region due to frequent rains.</p>"},{"title":"How the coffee is processed","content":"<ol><li data-list-item-id=\"eb951cdfaa8741feb6d6f3bec8564f3b9\"><strong>Sorting</strong> - processing of this lot began with strict sorting at the central station, selecting <strong>only the ripest cherries</strong>.</li><li data-list-item-id=\"e1edaa7c9c996ea81065cce1fa01e8a7f\"><strong>Fermentation</strong> - after washing, the whole cherries were placed in sealed barrels and <strong>fermented without oxygen for 96 hours</strong>. This long fermentation is responsible for the coffee's complexity and distinct vinous character.</li><li data-list-item-id=\"edcd7cb7dccdec67a86c887303179929f\"><strong>Drying</strong> - the coffee was then moved to the <strong>Nuna drying box</strong>, where it dried at a constant temperature of <strong>35–40°C</strong> for <strong>100–120 hours</strong>. This controlled drying process ensures the beans retain a clear and sweet flavour profile.</li></ol>"},{"title":"Variety","content":"<p>The <strong>Castillo</strong> variety is highly popular in Colombia for its <strong>resilience and stability</strong>. Combined with modern natural processing and long barrel fermentation, its profile transforms from classic chocolate notes to a <strong>rich fruitiness reminiscent of orange wine</strong>.</p>"}],"cs":[{"title":"Příprava","content":"<p>Tuto kávu pražíme na espresso. Hodí se do pákových i automatických kávovarů, i pro domácí přípravu.</p><p>Chcete ji na filtr? Pražíme ji i ve verzi na filtr - najdete ji zde: <a href=\"https://fathers.cz/kava/filtr/kolumbie-chapata\"><strong>Kolumbie – Chapata</strong></a></p>"},{"title":"Příběh farmy","content":"<p>Je v ní cítit péče, se kterou ji <strong>Luis Miguel a lidé v Ansermě</strong> připravili, i odvaha, se kterou se pustili do <strong>nových způsobů zpracování</strong>. Je to káva, ke které se člověk rád vrací pro její <strong>srozumitelnost a hřejivý charakter</strong>.</p><p>Družstvo Anserma sdružuje <strong>přes dva tisíce drobných pěstitelů</strong>, pro které je výběrová káva hlavním životním pilířem. Aby ochránili kvalitu těch nejlepších mikrolotů, vybudovali v Ansermě <strong>klimatizované sklady</strong>, kde je káva chráněna před výkyvy teplot a vlhkosti.</p><p>Luis Miguel vsadil na inovace a investoval do <strong>speciálního sušicího boxu značky Nuna Coffee</strong>. Tato technologie dokáže <strong>přesně regulovat teplotu a vlhkost</strong>, což je v nevyzpytatelném klimatu kolumbijských And zásadní. Díky tomu mohou v Ansermě produkovat <strong>naturální kávy s vysokou čistotou chuti</strong>, což bylo v této oblasti dříve kvůli častým dešťům velmi riskantní.</p>"},{"title":"Jak se káva zpracovává","content":"<ol><li data-list-item-id=\"ee55052cd23c917ee7aa82f6a300564ad\"><strong>Sběr a třídění</strong> - zpracování této šarže začalo přísným tříděním v centrální stanici, kde se vybíraly <strong>pouze ty nejzralejší třešně</strong>.</li><li data-list-item-id=\"e4e46fa54144ccf83eef71e9a73ce9503\"><strong>Fermentace</strong> - po promytí se celé třešně uložily do uzavřených sudů, kde <strong>bez přístupu vzduchu fermentovaly 96 hodin</strong>. Tahle dlouhá fermentace stojí za komplexností a výrazným vinným charakterem kávy.</li><li data-list-item-id=\"e02e8fc1834a3346261eec2911864f474\"><strong>Sušení</strong> - káva se přesunula do <strong>sušicího boxu Nuna</strong>, kde se za stálé teploty <strong>35–40 °C</strong> sušila <strong>100–120 hodin</strong>. Tenhle řízený proces sušení zajišťuje, že se káva nezkazí a uchová si jasný a sladký chuťový profil.</li></ol>"},{"content":"<p>Odrůda <strong>Castillo</strong> je v Kolumbii velmi oblíbená pro svou <strong>odolnost a stabilitu</strong>. V kombinaci s moderním naturálním zpracováním a dlouhou fermentací v sudech se její profil proměňuje od klasických čokoládových tónů až k <strong>bohaté ovocnosti připomínající oranžové víno</strong>.</p>","title":"Odrůda"}]},"gallery":[{"id":"7faf2e92-7d26-46b9-a8c7-33d7838a3a9b","photo":{"title":"Chapata_00003-2","bucket":"Upload","size":466240,"type":"image/jpeg","path":"products/gallery.3.photo/chapata-00003-2-a57bce46-197a-4c3e-8a94-41328913d7cd.jpg"}},{"id":"9bf1e3f7-9d80-4974-9828-018c2c81c09e","photo":{"type":"image/jpeg","size":411293,"bucket":"Upload","path":"products/gallery.1.photo/chapata-00002-2-fd 20,"withoutTax":437.95,"withTax":525.54},"countries":["Bulgaria"]},"21":{"price":{"taxRate":21,"withoutTax":437.95,"withTax":529.92},"countries":["Latvia","Lithuania"]},"22":{"price":{"taxRate":22,"withoutTax":437.95,"withTax":534.3},"countries":["Italy"]},"23":{"price":{"taxRate":23,"withoutTax":437.95,"withTax":538.68},"countries":["Portugal"]},"24":{"price":{"taxRate":24,"withoutTax":437.95,"withTax":543.06},"countries":["Estonia"]},"25":{"price":{"taxRate":25,"withoutTax":437.95,"withTax":547.44},"countries":["Croatia","Denmark"]},"27":{"price":{"taxRate":27,"withoutTax":437.95,"withTax":556.2},"countries":["Hungary"]},"5.5":{"price":{"taxRate":5.5,"withoutTax":437.95,"withTax":462.04},"countries":["France"]},"9.5":{"price":{"taxRate":9.5,"withoutTax":437.95,"withTax":479.56},"countries":["Slovenia"]}}}}],"attributes":[]},{"active":true,"attributeGroups":[],"common":true,"createdAt":"2026-08-07T10:12:08.264Z","createdBy":"93744832-d0e1-706f-c639-8555012ad0a2","description":{"cs":"<p><i>Oblast Cauca jsme navštívili osobně a v ACC jsme viděli, jak velkou roli tady hraje společná práce, pečlivost a důvěra mezi producenty. Tahle káva od Robinsona Rivery je Pink Bourbon zpracovaný honey metodou a chutná jako Černý rybíz, bezová limonáda, mléčná čokoláda</i></p><p><strong>Země:</strong> Kolumbie<br><strong>Oblast:</strong> Piendamó, Cauca<br><strong>Farma / stanice:</strong> ACC<br><strong>Producent:</strong> Robinson Rivera<br><strong>Nadmořská výška:</strong> 1700 - 2100 m n. m.<br><strong>Odrůda:</strong> Pink Bourbon<br><strong>Zpracování:</strong> honey<br><strong>Chuťový profil:</strong> Černý rybíz, bezová limonáda, mléčná čokoláda<br><strong>Typ kávy:</strong> pražená zrnková káva, arabika</p>","en":"<p><i>We visited the Cauca region in person, and at ACC we saw how important shared work, care, and trust between producers are here. This coffee from Robinson Rivera is a Pink Bourbon processed with the honey method and it tastes like Black currant, elderflower lemonade, milk chocolate</i></p><p><strong>Country:</strong> Colombia<br><strong>Region:</strong> Piendamó, Cauca<br><strong>Farm / station:</strong> ACC<br><strong>Producer:</strong> Robinson Rivera<br><strong>Altitude:</strong> 1700 - 2100 m a.s.l.<br><strong>Variety:</strong> Pink Bourbon<br><strong>Processing:</strong> honey<br><strong>Taste notes:</strong> Black currant, elderflower lemonade, milk chocolate<br><strong>Coffee type:</strong> roasted whole bean coffee, arabica</p>"},"disclosures":{"en":[{"title":"Preparation","content":"<p>Great for all filter brewing methods (V60, Solo Dripper, Aeropress, Chemex, French press, Clever Dripper…).</p>"},{"content":"<p>ACC is an association of coffee growers from the central part of the Cauca region in southern Colombia. It was founded in 2016 in Piendamó <strong>with the goal of improving coffee quality throughout the entire process</strong> - from cultivation to delivery.</p><p>Behind the association is <strong>Robinson Rivera</strong>, a coffee producer from Piendamó. They grew up in modest conditions and did not have the opportunity to complete basic education. Still, they decided to look for a way to help people in the surrounding area, who often found themselves involved in illegal coca cultivation.</p><p>ACC was created so that growers could add value to their coffee, increase their income, and have a reason to replace coca with coffee plants. Today, the association has 77 members. The average farm size is 1.5 hectares, and the coffees grow at altitudes between 1700 and 2100 metres.</p><p>The association helps members with quality control, cupping, and feedback. The team includes a certified <strong>Q grader</strong> (a specialist in sensory evaluation of coffee) and a small <strong>QC lab</strong> (a quality-control room for regular sample tasting), where coffees are evaluated regularly. Robinson and their brother also designed and built their own small processing setup, where they work with natural coffees and honey processing with controlled fermentation.</p>","title":"The Story"},{"content":"<p>First, <strong>very ripe coffee cherries</strong> with a higher sugar content are harvested. Then they go through separation by density in a water bath, which removes light or damaged fruit, and only healthy cherries continue.</p><p>This is followed by <strong>a 12-hour oxidation in a washing tank.</strong> The coffee is then depulped and ferments for another 36 hours in the sweet fruit layer that remains on the beans even after the skin is removed.</p><p>Finally, the coffee is dried in a parabolic dryer for 5 to 6 days until it reaches the target moisture content of 10%. This approach helps develop sweetness while keeping the cup clean.</p>","title":"How is the coffee processed?"},{"content":"<p><strong>Pink Bourbon</strong> is a variety known for its sweetness, delicate structure, and a more pronounced <strong>aromatic character.</strong> In good conditions, it can offer a clean, layered profile that works especially well with gentle honey processing.</p><p>In this coffee, the sweetness of very ripe cherries meets careful sorting and controlled fermentation.</p>","title":"Variety"}],"cs":[{"title":"Příprava","content":"<p>Tuto kávu pražíme na filtr. Hodí se pro všechny druhy přípravy filtrované kávy (V60, Solo Dripper, Aeropress, Chemex, French press, Chytráček...).</p>"},{"title":"Příběh farmy","content":"<p>ACC je asociace pěstitelů kávy z centrální části regionu Cauca v jižní Kolumbii. Vznikla v roce 2016 v Piendamó <strong>s cílem zlepšovat kvalitu kávy v celém procesu</strong> - od pěstování až po doručení.</p><p>Za vznikem asociace stojí <strong>Robinson Rivera</strong>, producent kávy z Piendamó. Vyrůstal ve skromných podmínkách a neměl možnost dokončit základní vzdělání. Přesto se rozhodl hledat cestu, jak pomoci lidem ve svém okolí, kteří se často pohybovali v nelegálním pěstování koky.</p><p>ACC vznikla proto, aby pěstitelé mohli své kávě přidat hodnotu, zvýšit své příjmy a měli důvod nahrazovat koku kávovníky. Dnes má asociace 77 členů. Průměrná velikost farmy je 1,5 hektaru a kávy rostou v nadmořské výšce 1700 až 2100 metrů.</p><p>Asociace pomáhá členům s kontrolou kvality, cuppingem a zpětnou vazbou. Součástí týmu je certifikovaný <strong>Q grader</strong> (odborník na senzorické hodnocení kávy) a malá <strong>QC laboratoř</strong> (místnost pro kontrolu kvality a pravidelné ochutnávání vzorků), kde se kávy pravidelně hodnotí. Robinson se svým bratrem navíc navrhli a postavili vlastní malé zázemí pro zpracování kávy, kde pracují s naturálními kávami a honey zpracováním s řízenou fermentací.</p>"},{"title":"Jak se káva zpracovává","content":"<p>Nejprve se sbírají <strong>velmi zralé kávové třešně</strong> s vyšším obsahem cukru. Poté procházejí oddělením podle hustoty ve vodní lázni, při kterém se odstraní lehké nebo poškozené plody a dál pokračují jen zdravé třešně.</p><p>Následuje <strong>12hodinová oxidace v promývací nádrži.</strong> Poté se káva odslupkuje a dalších 36 hodin fermentuje v sladké dužině, která na zrnu zůstává i po odstranění slupky.</p><p>Na závěr se káva suší v parabolické sušárně 5 až 6 dní, dokud nedosáhne cílové vlhkosti 10 %. Tento postup pomáhá rozvíjet sladkost a zároveň zachovat čistotu chuti.</p>"},{"content":"<p><strong>Pink Bourbon</strong> je odrůda známá svou sladkostí, jemnou strukturou a výraznějším <strong>aromatickým projevem.</strong> V dobrých podmínkách umí nabídnout čistý a vrstvený profil, který dobře funguje právě u šetrného honey zpracování.</p><p>V této kávě se potkává sladkost velmi zralých třešní, pečlivé třídění a kontrolovaná fermentace.</p>","title":"Odrůda"}]},"gallery":[{"id":"e2c0277e-0225-4669-aa4a-96151d773988","photo":{"bucket":"Storage","title":"1Colombia - Robinson","path":"products/gallery.0.photo/1colombia-robinson-9304550f-b90a-4f69-b4ca-93d6b91b5051.jpg","type":"image/jpeg","size":2703313}},{"id":"275f21b2-0c07-4a1c-b485-b3718bce4d84","photo":{"title":"2Colombia - ithoutTax":492.7,"withTax":522.26},"countries":["Belgium"]},"7":{"price":{"taxRate":7,"withoutTax":492.7,"withTax":527.19},"countries":["Germany"]},"8":{"price":{"taxRate":8,"withoutTax":492.7,"withTax":532.12},"countries":["Poland"]},"9":{"price":{"taxRate":9,"withoutTax":492.7,"withTax":537.04},"countries":["Netherlands","Romania"]},"10":{"price":{"taxRate":10,"withoutTax":492.7,"withTax":541.97},"countries":["Austria","Spain"]},"12":{"price":{"taxRate":12,"withoutTax":492.7,"withTax":551.82},"countries":["Czechia","Sweden"]},"13":{"price":{"taxRate":13,"withoutTax":492.7,"withTax":556.75},"countries":["Greece"]},"14":{"price":{"taxRate":14,"withoutTax":492.7,"withTax":561.68},"countries":["Finland"]},"19":{"price":{"taxRate":19,"withoutTax":492.7,"withTax":586.31},"countries":["Slovakia"]},"20":{"price":{"taxRate":20,"withoutTax":492.7,"withTax":591.24},"countries":["Bulgaria"]},"21":{"price":{"taxRate":21,"withoutTax":492.7,"withTax":596.17},"countries":["Latvia","Lithuania"]},"22":{"price":{"taxRate":22,"withoutTax":492.7,"withTax":601.09},"countries":["Italy"]},"23":{"price":{"taxRate":23,"withoutTax":492.7,"withTax":606.02},"countries":["Portugal"]},"24":{"price":{"taxRate":24,"withoutTax":492.7,"withTax":610.95},"countries":["Estonia"]},"25":{"price":{"taxRate":25,"withoutTax":492.7,"withTax":615.88},"countries":["Croatia","Denmark"]},"27":{"price":{"taxRate":27,"withoutTax":492.7,"withTax":625.73},"countries":["Hungary"]},"5.5":{"price":{"taxRate":5.5,"withoutTax":492.7,"withTax":519.8},"countries":["France"]},"9.5":{"price":{"taxRate":9.5,"withoutTax":492.7,"withTax":539.51},"countries":["Slovenia"]}}}}],"attributes":[]},{"active":true,"attributeGroups":[],"common":true,"createdAt":"2026-07-08T11:23:14.367Z","createdBy":"93744832-d0e1-706f-c639-8555012ad0a2","description":{"cs":"<p><i>Výběr <strong>pěti aktuálních káv na filtr z naší pražírny v menším 50g balení.</strong> Hodí se pro každého, kdo chce <strong>ochutnat víc káv najednou</strong>, porovnat různé chuťové profily nebo si najít svého favorita mezi aktuálními kávami. A je skvělý i<strong> jako dárek pro někoho</strong>, komu chcete udělat radost výběrovou kávou, ale <strong>nejste si jistí,</strong> co přesně mu chutná.</i></p>","en":"<p><i>A <strong>selection of five current filter coffees</strong> from our roastery in smaller 50 g packs. It is made for anyone who wants t<strong>o taste more coffees at once</strong>, compare different flavour profiles or find a favourite among our current coffees. It also makes a <strong>great gift</strong> for someone you want to treat to specialty coffee, but you are not sure what exactly they like.</i></p>"},"disclosures":{"cs":[{"content":"<p>Vhodná pro všechny druhy přípravy filtrované kávy (V60, Solo Dripper, Aeropress, Chemex, French press, Chytráček...).</p>","title":"Příprava"},{"content":"<p>V téhle sadě najdete <strong>5× 50 g výběrové kávy z naší aktuální nabídky.</strong> Každou kávu balíme zvlášť do sample obalu a společně je ukládáme do krabičky Father’s Favourite Coffee.</p><p>Sadu skládáme podle toho, co je právě dostupné v naší nabídce. Díky tomu se její obsah může v čase měnit. Najdete v ní kávy s různými chuťovými profily, původy nebo způsoby zpracování.</p><p>Detaily jednotlivých káv, jejich původ, zpracování a doporučenou přípravu najdete vždy na stránkách konkrétních produktů.</p><p>Guatemala - Granada - <a href=\"https://fathers.cz/kava/filtr/guatemala-granada\">detail kávy</a></p><p>Kolumbie - Robinson - <a href=\"https://fathers.cz/kava/filtr/kolumbie-inza\">detail kávy</a></p><p>Etiopie - Chelbesa - <a href=\"https://fathers.cz/kava/filtr/etiopie-chelbesa\">detail kávy</a></p><p>Brazílie - Julia Campos - <a href=\"https://fathers.cz/kava/filtr/brazilie-julia-campos\">detail kávy</a></p><p>Uganda - Zebigi - <a href=\"https://fathers.cz/kava/filtr/uganda-zebigi\">detail kávy</a></p>","title":"Popis produktu"},{"title":"Guatemala - Granada","content":"<p><strong>Země:</strong> Guatemala<br><strong>Oblast:</strong> Huehuetenango<br><strong>Farma / stanice:</strong> Finca La Bolsa<br><strong>Producent:</strong> rodina Vides<br><strong>Nadmořská výška:</strong> 1&nbsp;300-1&nbsp;600&nbsp;m&nbsp;n. m.<br><strong>Odrůda:</strong> Caturra, Bourbon<br><strong>Zpracování:</strong> suché (natural)<br><strong>Chuťový profil:</strong> Kešu, švestky, meduňkový čaj<br>&nbsp;</p><p>Granada pochází z&nbsp;guatemalské farmy Finca La Bolsa v&nbsp;oblasti Huehuetenango. Farmu založil v&nbsp;roce 1958&nbsp;Jorge Vides a&nbsp;dnes ji vede další generace rodiny Vides. Tahle káva je směsí odrůd Caturra a&nbsp;Bourbon, zpracovaná suchou metodou, a&nbsp;v&nbsp;jejím profilu najdete kešu, švestky, meduňkový čaj.</p>"},{"title":"Kolumbie - Robinson","content":"<p><strong>Země:</strong> Kolumbie<br><strong>Oblast:</strong> Piendamó, Cauca<br><strong>Farma / stanice:</strong> ACC<br><strong>Producent:</strong> Robinson Rivera<br><strong>Nadmořská výška:</strong> 1700&nbsp;- 2100&nbsp;m&nbsp;n. m.<br><strong>Odrůda:</strong> Pink Bourbon<br><strong>Zpracování:</strong> honey<br><strong>Chuťový profil:</strong> Černý rybíz, bezová limonáda, mléčná čokoláda</p><p>&nbsp;</p><p>Oblast Cauca jsme navštívili osobně a&nbsp;v&nbsp;ACC jsme viděli, jak velkou roli tady hraje společná práce, pečlivost a&nbsp;důvěra mezi producenty. Tahle káva od Robinsona Rivery je Pink Bourbon zpracovaný honey metodou a&nbsp;chutná jako Černý rybíz, bezová limonáda, mléčná čokoláda.</p>"},{"title":"Etiopie - Chelbesa","content":"<p><strong>Země:</strong> Etiopie&nbsp;&nbsp;&nbsp;&nbsp;<br><strong>Oblast:</strong> Gedeb&nbsp;&nbsp;<br><strong>Farma / stanice:</strong> Chelbesa (stanice spravovaná Ephtah Specialty Coffee)&nbsp;&nbsp;<br><strong>Producent:</strong> Ephtah Specialty Coffee a&nbsp;lokální drobní farmáři&nbsp;&nbsp;<br><strong>Nadmořská výška:</strong> 2150&nbsp;– 2200&nbsp;m&nbsp;n. m.&nbsp;&nbsp;<br><strong>Odrůda:</strong> 74110, 74112&nbsp;&nbsp;<br><strong>Zpracování:</strong> promyté (washed)<br><strong>Chuťový profil:</strong> <i>jasmín, bergamot, broskový čaj a&nbsp;med</i></p><p><br>Káva z&nbsp;etiopské stanice Chelbesa od producenta Ephtah patří mezi ty, ke kterým se ve Father’s&nbsp;rádi vracíme a&nbsp;nejen pro to, že je známe osobně. Lokální etiopské odrůdy zpracované promytou metodou jsme pro vás upražili jak ve verzi na filtr, tak i&nbsp;ve verzi na espresso. Těšit se můžete na tóny jasmínu, bergamotu, broskvového čaje a&nbsp;medu.</p>"},{"title":"Brazílie - Julia Campos","content":"<p><strong>Země:</strong> Brazílie<br><strong>Oblast:</strong> South of Minas, město Três Pontas-MG<br><strong>Farma / stanice:</strong> Sítio da Jaja<br><strong>Producent:</strong> Gilberto Basilio a Jaceline Campos<br><strong>Nadmořská výška:</strong> 1200 m n. m.<br><strong>Odrůda:</strong> Acaua, Mundo Novo, Paraiso, Yellow Catuai a Icatu<br><strong>Zpracování:</strong> suché (natural)<br><strong>Chuťový profil:</strong> Baileys, Citronová tráva, Datle</p><p>&nbsp;</p><p>Sítio da Jaja se rozkládá v regionu South of Minas na <strong>celkové ploše 45 hektarů</strong>, z čehož kávovníky zaujímají 30 hektarů. Farmu v roce 2015 koupila úspěšná podnikatelka <strong>Jaceline Silva Campo (známá jako Jaja)</strong> společně se svým manželem.</p><p>Jaja je sestra známého zpěváka Miltona Nascimento, přezdívaného Bituca, se kterým v dětství často běhala mezi kávovníky na farmě jejich strýce. Dnes se na své vlastní farmě věnuje pěstování s velikou radostí a společně se zaměřují na <strong>neustálé zlepšování kvality.</strong> Pravidelně školí své zaměstnance a předávají jim znalosti, aby dosáhli co nejlepších výsledků při přípravě jednotlivých kávových šarží.</p><p>Z hlediska udržitelnosti se farma chová <strong>velmi zodpovědně k okolní krajině.</strong> Uplatňuje integrovanou ochranu proti škůdcům, biologickou kontrolu, kombinované systémy hospodaření a využívá organicko-minerální hnojiva.</p><p>Významnou část území <strong>tvoří chráněná oblast,</strong> která svou rozlohou bezpečně překračuje zákonem stanovené minimum. Součástí každodenního chodu je také podrobný plán na <strong>ochranu pramenů vody a místní divoké přírody.</strong> Elektronické ověření potvrzuje, že na pozemcích farmy nehrozí riziko odlesňování a hospodaření je v plném souladu s brazilskými zákony i evropským nařízením EUDR, včetně přísného dohledu nad dodržováním lidských práv a zákazu nucené práce.</p>"},{"title":"Uganda - Zebigi","content":"<p><strong>Země:</strong> Uganda<br><strong>Oblast:</strong> Mt Elgon, East Uganda<br><strong>Farma / stanice:</strong> spolupracující farmáři v okolí Zebigi / The Coffee Gardens<br><strong>Producent:</strong> The Coffee Gardens<br><strong>Nadmořská výška:</strong> 1 800 – 2 200 m n. m.<br><strong>Odrůda:</strong> SL14, SL28, Nyasaland<br><strong>Zpracování:</strong> promytá / dry fermentation<br><strong>Chuťový profil: </strong>heřmánkový čaj, máslové sušenky, pomelo<br><br>Zebigi pochází z oblasti Mt Elgon ve východní Ugandě, která je známá svou bohatou vulkanickou půdou a ideálními podmínkami pro pěstování výběrové arabiky. Tato lokalita se rozkládá v nadmořské výšce 1 800 – 2 200 m n. m., což spolu s chladnějším klimatem a bohatou biodiverzitou přispívá k pomalejšímu zrání kávových třešní a intenzivnějšímu rozvoji chuti.</p>"}],"en":[{"title":"Brewing","content":"<p>Suitable for all filter brewing methods (V60, Solo Dripper, AeroPress, Chemex, French press, Clever Dripper...).</p>"},{"content":"<p>In this set, you will find <strong>5× 50 g of specialty coffee from our current selection.</strong> Each coffee is packed separately in a sample bag and placed together in a Father’s Favourite Coffee box.</p><p>We put the set together based on what is currently available in our offer. That means its contents may change over time. Inside, you will find coffees with different flavour profiles, origins or processing methods.</p><p>You can always find the details of each coffee, including its origin, processing and recommended brewing, on the individual product pages.</p><p>Guatemala - Granada - <a href=\"https://fathers.cz/en/coffee/filter/guatemala-granada\">detail of the coffee</a></p><p>Colombia - Robinson - <a href=\"https://fathers.cz/en/coffee/filter/colombia-robinson\">detail of the coffee</a></p><p>Ethiopia - Chelbesa - <a href=\"https://fathers.cz/en/coffee/filter/etiopia-chelbes\">detail of the coffee</a></p><p>Brazil - Julia Campos - <a href=\"https://fathers.cz/en/coffee/filter/brazil-julia-campos\">detail of the coffee</a></p><p>Uganda - Zebigi - <a href=\"https://fathers.cz/en/coffee/filter/uganda-zebigi\">detail of the coffee</a></p>","title":"Product description"},{"content":"<p><strong>Country:</strong> Guatemala<br><strong>Region:</strong> Huehuetenango<br><strong>Farm / station:</strong> Finca La Bolsa<br><strong>Producer:</strong> Vides family<br><strong>Altitude:</strong> 1,300-1,600&nbsp;m&nbsp;above sea level<br><strong>Variety:</strong> Caturra, Bourbon<br><strong>Processing:</strong> natural<br><strong>Taste notes:</strong> Cashew nuts, plums, lemon balm tea<br>&nbsp;</p><p>Granada comes from the Guatemalan farm Finca La Bolsa in the Huehuetenango region. The farm was founded in 1958&nbsp;by Jorge Vides and is now run by the next generation of the Vides family. This coffee is a&nbsp;blend of Caturra and Bourbon varieties, processed using the natural method, and in its profile you will find Cashew nuts, plums, lemon balm tea</p>","title":"Guatemala - Granada"},{"title":"Colombia - Robinson","content":"<p><strong>Country:</strong> Colombia<br><strong>Region:</strong> Piendamó, Cauca<br><strong>Farm / station:</strong> ACC<br><strong>Producer:</strong> Robinson Rivera<br><strong>Altitude:</strong> 1700&nbsp;- 2100&nbsp;m&nbsp;a.s.l.<br><strong>Variety:</strong> Pink Bourbon<br><strong>Processing:</strong> honey<br><strong>Taste notes:</strong> Black currant, elderflower lemonade, milk chocolate<br>&nbsp;</p><p>We visited the Cauca region in person, and at ACC we saw how important shared work, care, and trust between producers are here. This coffee from Robinson Rivera is a&nbsp;Pink Bourbon processed with the honey method and it tastes like Black currant, elderflower lemonade, milk chocolate</p>"},{"content":"<p><strong>Country:</strong> Ethiopia<br><strong>Region:</strong> Chelbesa, Gedeb<br><strong>Washing Station:</strong> Chelbesa<br><strong>Altitude:</strong> 2200&nbsp;m&nbsp;a.s.l.<br><strong>Varietal:</strong> Heirloom<br><strong>Process:</strong> Washed<br><strong>Flavor profile:</strong> peach, jasmine, milk chocolate<br><br>Coffee from the Chelbesa station in Ethiopia, produced by Ephtah, is one we are always happy to return to at Father’s&nbsp;and not only because we know them personally. We roasted these local Ethiopian varieties, processed using the washed method, both for filter and espresso. You can look forward to notes of jasmine, bergamot, peach tea and honey.</p>","title":"Ethiopia - Chelbesa"},{"title":"Brazil - Julia Campos","content":"<p><i><strong>Country:</strong> Brazil</i><br><i><strong>Region:</strong> South of Minas, Três Pontas-MG</i><br><i><strong>Farm / station:</strong> Sítio da Jaja</i><br><i><strong>Producer:</strong> Gilberto Basilio and Jaceline Campos</i><br><i><strong>Altitude:</strong> 1200 m a.s.l.</i><br><i><strong>Variety:</strong> Acaua, Mundo Novo, Paraiso, Yellow Catuai and Icatu</i><br><i><strong>Processing:</strong> natural</i><br><i><strong>Taste profile: </strong>Baileys, Lemon grass, dates</i></p><p>&nbsp;</p><p>Sítio da Jaja is located in the South of Minas region and covers a <strong>total area of 45 hectares</strong>, with coffee trees planted on 30 hectares. The farm was purchased in 2015 by successful entrepreneur <strong>Jaceline Silva Campo (known as Jaja)</strong> together with her husband.</p><p>Jaja is the sister of the well-known singer Milton Nascimento, nicknamed Bituca, with whom she often ran between coffee trees on their uncle’s farm as a child. Today, she tends her own farm with great joy, and together they focus on <strong>continuous quality improvement.</strong> They regularly train their employees and share knowledge to achieve the best possible results when preparing individual coffee lots.</p><p>In terms of sustainability, the farm acts <strong>very responsibly towards the surrounding landscape.</strong> It uses integrated pest management, biological control, combined farming systems and organic-mineral fertilisers.</p><p>A significant part of the land <strong>is a protected area,</strong> safely exceeding the minimum required by law. The farm’s daily operations also include a detailed plan for <strong>protecting water springs and local wildlife.</strong> Electronic verification confirms that there is no risk of deforestation on the farm’s land and that its operations fully comply with Brazilian laws and the European EUDR regulation, including strict oversight of human rights and the prohibition of forced labour.</p>"},{"content":"<p><strong>Country:</strong> Uganda<br><strong>Region:</strong> Upper Bukyabo<br><strong>Processing station:</strong> Coffee Gardens<br><strong>Altitude:</strong> 1800-2200 m.a.s.l.<br><strong>Variety:</strong> SL14, SL28, Nyasaland<br><strong>Processing:</strong> washed<br><strong>Taste profile:</strong> Chamomile tea with lemon and hazelnut cream</p><p>&nbsp;</p><p>Coffee Gardens was founded in 2017 to produce great specialty coffee ethically and offer a transparent and direct connection between coffee growers and consumers. Last year, our export company Falcon, with the support of the roasters, trained farmers belonging to Coffee Gardens in growing coffee among shade trees, good agricultural practices, and better harvesting techniques. In July, Falcon distributed over 8,300 seedlings of shade, fruit, and fast-growing trees. This year the training continues, and the company TCG is also building toilet blocks for three primary schools in the area to improve the quality of life in the area.</p>","title":"Uganda - Zebigi"}]},"gallery":[],"id":"8e1ebf27-0d59-4e9e-8f88-65bc33c89ffe","legacyIds":[],"markedAsNewAt":"2026-08-03T13:06:00.000+02:00","metaDescription":{"cs":"Sample sada 5× 50 g výběrové kávy Father’s z aktuální nabídky. Ideální na ochutnání různých chuťových profilů i jako dárek pro někoho, u koho nevíte, co mu chutná.","en":"Sample set with 5× 50 g of Father’s specialty coffee from our current selection. Ideal for tasting different flavour profiles and as a gift for someone whose coffee preferences you do not know."},"metaKeywords":{"cs":"sample sada kávy, ochutnávková sada kávy, výběrová káva, Father’s Coffee, 5× 50 g káva, dárková sada kávy, dárek pro milovníka kávy, dárek pro někoho, kdo má rád kávu, degustace kávy, káva na ochutnání","en":"coffee sample set, specialty coffee tasting set, specialty coffee, Father’s Coffee, 5× 50 g coffee, coffee gift set, gift for a coffee lover, gift for someone who likes coffee, coffee tasting, coffee to try"},"metaTitle":{"cs":"Sample sada - Father’s Coffee Roastery","en":"Sample Set - Father’s Coffee Roastery"},"modifiedAt":"2026-09-02T12:45:12.724Z","modifiedBy":"93744832-d0e1-706f-c639-8555012ad0a2","name":{"cs":"Sample box","en":"Sample Box"},"partOfFathersChoice":false,"searchIndex":"8e1ebf270d594e9e8f8865bc33c89ffe sample box sample box","stock":[],"subcategoryId":"67ff30ae-622c-4443-bcd2-affb54f55781","urlSlug":{"cs":"sample-box","en":"sample-box"},"urlSlug_cs":"sample-box","urlSlug_en":"sample-box","variantType":"Size","plainDescription":{"cs":"Výběr pěti aktuálních káv na filtr z naší pražírny v menším 50g balení. Hodí se\npro každého, kdo chce ochutnat víc káv najednou, porovnat různé chuťové profily\nnebo si najít svého favorita mezi aktuálními kávami. A je skvělý i jako dárek\npro někoho, komu chcete udělat radost výběrovou kávou, ale nejste si jistí, co\npřesně mu chutná.","en":"A selection of five current filter coffees from our roastery in smaller 50 g\npacks. It is made for anyone who wants to ta .”</strong></p><p><strong>Country:</strong>&nbsp;Colombia<br><strong>Region:</strong> Rio Sucio, Caldas<br><strong>Farm:</strong>&nbsp;Siruma Coffee Farms<br><strong>Altitude:</strong> 1600-2000 m.a.s.l.<br><strong>Variety:</strong> Castillo, Colombia<br><strong>Processing:</strong> washed – sugar cane decaf<br><strong>Taste profile:</strong>&nbsp;orange cake, cane sugar, white tea</p>","cs":"<p><i><strong>Země:</strong>&nbsp;Kolumbie</i><br><i><strong>Oblast</strong>: Rio Sucio, Caldas</i><br><i><strong>Farma</strong>: Siruma Coffee farmy</i><br><i><strong>Nad</strong>.&nbsp;<strong>výška</strong>: 1600-2000 m n.m.</i><br><i><strong>Odrůda</strong>: Castillo, Colombia</i><br><i><strong>Zpracování</strong>: promyté – sugar cane decaf</i><br><i><strong>Chuťový</strong>&nbsp;<strong>profil</strong>: pomerančový koláč, třtinový cukr, bílý čaj</i></p><p><i>Naše káva <strong>bez kofeinu</strong> chutná po svěžím pomerančovém koláči, třtinovém cukru a bílém čaji. Zbavili ji kofeinu <strong>přírodním sugar cane</strong> způsobem. Více o této skvělé metodě se dočtete v článku na blogu </i><a href=\"https://fathers.cz/blog/je-bezkofeinova-kava-vubec-kava\"><i>tady</i></a><i>.</i></p><p><i>Šálek této kávy se s klidem může stát vaším před spánkovým rituálem. Jeho název ATUNKAA, totiž v překladu znamená “spánek a ospalé sny”.</i></p>"},"disclosures":{"en":[{"title":"PRODUCER","content":"<p>Siruma is a Colombian coffee company founded five years ago to partner with underserved farming communities in Cauca, Caldas, and Tolima. With an emphasis on social aspects and transparency, they primarily collaborate with indigenous communities that cultivate excellent coffee but need its marketing and export assistance. The company’s name comes from the indigenous Wayuunaiki language and means “Heaven and Skies.” Atunkaa, the name of this coffee, comes from the same language, which translates to “sleep and sleepy dreams.”<br><br>The coffee is decaffeinated by Descafecol using a sustainable sugarcane-based process.</p>"},{"content":"<p>Castillo is the most widespread coffee variety grown in Colombia. It is characterized by high resistance to coffee rust and small bushes, which allows for dense planting. This means a large number of fruits in a relatively small space. Castillo produces coffee with good taste quality and has a significant share in Colombian coffee production.</p>","title":"Varietal"}],"cs":[{"title":"PRODUCENT","content":"<p>Společnost Siruma Coffee vznikla před pěti lety se záměrem exportovat kávu vysoké kvality ze tří regionů Kolumbie – Cauca, Caldas a Tolima. S důrazem na sociální aspekt a transparentnost spolupracují převážně s indiánskými komunitami, které pěstují skvělou kávu, ale potřebují pomoct s jejím prodejem a vývozem. Název Siruma pochází z jazyka Wayuunaiki (indiánské obyvatelstvo severní Kolumbie) a znamená “nebe a obloha”. Ze stejného jazyka pochází název této kávy ATUNKAA, který v překladu znamená “spánek a ospalé sny”.<br><br>Kofeinu byla káva zbavena v závodě DESCAFENOL udržitelným a přírodním způsobem, pomocí výtažku z cukrové třtiny.</p>"},{"content":"<p>Castillo je nejrozšířenější kávová odrůda pěstovaná v Kolumbii. Charakterizuje jí vysoká odolnost proti kávové rzi a malé keře, díky kterým může být hustě sázená. To pak znamená velké množství plodů na relativně malém prostoru. Castillo produkuje kávu s dobrou chuťovou kvalitou a má významný podíl na kolumbijské kávové produkci.</p>","title":"ODRŮDA"}]},"gallery":[{"photo":{"path":"products/gallery.1.photo/whatsapp-image-2020-11-03-at-2-54-53-pm-1-0ad5baf9-3000-4d5f-bd7c-e34fb2fa4f22.jpg","size":408277,"bucket":"Upload","title":"WhatsApp Image 2020-11-03 at 2 54 53 PM (1)","type":"image/jpeg"},"id":"e78d3812-33bb-49d8-adc2-56c0d490e4d1"},{"id":"ca2fa0fb-e774-42fe-8d64-fcc92db9ccd0","photo":{"title":"WhatsApp Image 2020-11-03 at 2 54 53 PM (2)","path":"products/gallery.2.photo/whatsapp-image-2020-11-03-at-2-54-53-pm-2-02c5fe19-1395-4bfb-bf2f-2c0fd5d2431c.jpg","bucket" 00 m.a.s.l.<br><strong>Variety:</strong> Castillo, Colombia<br><strong>Processing:</strong> washed – sugar cane decaf<br><strong>Taste profile:</strong>&nbsp;orange cake, cane sugar, white tea</p>","cs":"<p><i><strong>Země:</strong>&nbsp;Kolumbie</i><br><i><strong>Oblast</strong>: Rio Sucio, Caldas</i><br><i><strong>Farma</strong>: Siruma Coffee farmy</i><br><i><strong>Nad</strong>.&nbsp;<strong>výška</strong>: 1600-2000 m n.m.</i><br><i><strong>Odrůda</strong>: Castillo, Colombia</i><br><i><strong>Zpracování</strong>: promyté – sugar cane decaf</i><br><i><strong>Chuťový</strong>&nbsp;<strong>profil</strong>: pomerančový koláč, třtinový cukr, bílý čaj</i></p><p><i>Naše káva <strong>bez kofeinu</strong> chutná po svěžím pomerančovém koláči, třtinovém cukru a bílém čaji. Zbavili ji kofeinu <strong>přírodním sugar cane</strong> způsobem. Více o této skvělé metodě se dočtete v článku na blogu </i><a href=\"https://fathers.cz/blog/je-bezkofeinova-kava-vubec-kava\"><i>tady</i></a><i>.</i></p><p><i>Šálek této kávy se s klidem může stát vaším před spánkovým rituálem. Jeho název ATUNKAA, totiž v překladu znamená “spánek a ospalé sny”.</i></p>"},"disclosures":{"cs":[{"title":"PRODUCENT","content":"<p>Společnost Siruma Coffee vznikla před pěti lety se záměrem exportovat kávu vysoké kvality ze tří regionů Kolumbie – Cauca, Caldas a Tolima. S důrazem na sociální aspekt a transparentnost spolupracují převážně s indiánskými komunitami, které pěstují skvělou kávu, ale potřebují pomoct s jejím prodejem a vývozem. Název Siruma pochází z jazyka Wayuunaiki (indiánské obyvatelstvo severní Kolumbie) a znamená “nebe a obloha”. Ze stejného jazyka pochází název této kávy ATUNKAA, který v překladu znamená “spánek a ospalé sny”.<br><br>Kofeinu byla káva zbavena v závodě DESCAFENOL udržitelným a přírodním způsobem, pomocí výtažku z cukrové třtiny.</p>"},{"title":"ODRŮDA","content":"<p>Castillo je nejrozšířenější kávová odrůda pěstovaná v Kolumbii. Charakterizuje jí vysoká odolnost proti kávové rzi a malé keře, díky kterým může být hustě sázená. To pak znamená velké množství plodů na relativně malém prostoru. Castillo produkuje kávu s dobrou chuťovou kvalitou a má významný podíl na kolumbijské kávové produkci.</p>"}],"en":[{"content":"<p>Siruma is a Colombian coffee company founded five years ago to partner with underserved farming communities in Cauca, Caldas, and Tolima. With an emphasis on social aspects and transparency, they primarily collaborate with indigenous communities that cultivate excellent coffee but need its marketing and export assistance. The company’s name comes from the indigenous Wayuunaiki language and means “Heaven and Skies.” Atunkaa, the name of this coffee, comes from the same language, which translates to “sleep and sleepy dreams.”<br><br>The coffee is decaffeinated by Descafecol using a sustainable sugarcane-based process.</p>","title":"PRODUCER"},{"content":"<p>Castillo is the most widespread coffee variety grown in Colombia. It is characterized by high resistance to coffee rust and small bushes, which allows for dense planting. This means a large number of fruits in a relatively small space. Castillo produces coffee with good taste quality and has a significant share in Colombian coffee production.</p>","title":"Varietal"}]},"gallery":[{"photo":{"title":"WhatsApp Image 2020-11-03 at 2 54 54 PM","bucket":"Upload","path":"products/gallery.1.photo/whatsapp-image-2020-11-03-at-2-54-54-pm-513ba1ae-8f2a-436a-b79b-7cfc2a80a836.jpg","size":379449,"type":"image/jpeg"},"id":"d9a6ede1-8ab3-4b23-bed1-7cb60c457df1"},{"id":"cc3be641-2e3f-4d90-a6e8-0e3b3dd3c0b7","photo":{"bucket":"Upload","title":"WhatsApp Image 2020-11-03 at 2 54 53 PM (2)","path":"products/gallery.2.photo/whatsapp-image-2020-11-03-at-2-54-53-pm-2-74e8900b-305d-440a-8128-10b576b8ee6b.jpg","size":387108,"type":"image/jpeg"}},{"id":"9756ff56-60eb-486d-ade8-f77e5a6ffc20","photo":{"bucket":"Upload","path":"products/gallery.3.photo/whatsapp-image-2020-11-03-at-2-54-53-pm-1-c1532
