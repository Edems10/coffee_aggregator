[project]
name = "coffee-aggregator"
version = "0.1.0"
description = "Polite multi-site collector of Czech and Slovak coffee bean data."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.13.3",
    "lxml>=5.3.0",
    "psycopg[binary]>=3.2.4",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
]

[project.scripts]
coffee-aggregator = "coffee_aggregator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coffee_aggregator"]

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "mypy>=1.15.0",
    "pre-commit>=4.1.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "responses>=0.25.6",
    "ruff>=0.16.7",
    "types-requests>=2.32.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs a live PostgreSQL pointed at by TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",   # conflicts with D211 (no blank line before class docstring); D211 kept
    "D213",   # conflicts with D212 (summary on the first line); D212 kept
    "COM812", # conflicts with the formatter (trailing comma insertion)
    "ISC001", # conflicts with the formatter (implicit string concatenation)
    "CPY001", # house rule: no copyright headers in code
    "D100",   # house rule: files never start with a docstring
    "D104",   # house rule: files never start with a docstring
]

# Dashes and the no-break space are load-bearing data in normalize.py, not typos.
allowed-confusables = ["\u2010", "\u2011", "\u2012", "\u2013", "\u2212", "\u00a0", "\u202f"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # assert is the point of a test
    "PLR2004",  # magic values are expected fixtures
    "D",        # tests document themselves through their names
    "ANN201",   # test functions always return None
    "SLF001",   # tests may poke at private helpers
    "ARG",      # fakes intentionally ignore arguments
    "FBT",      # parametrised booleans are data, not flag arguments
    "INP001",   # tests/ is deliberately not an importable package
    "S105",     # a robots.txt product token is not a credential
    "S106",     # same, passed as an argument
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_unused_ignores = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["responses.*", "lxml.*"]
ignore_missing_imports = true
